project:
  name: ChineseASR
  seed: 42
model:
  source: openai/whisper-small
  local_dir: models/asr_model
  language: zh
  task: transcribe
  local_files_only: true
training:
  method: lora
  epochs: 3
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  warmup_ratio: 0.1
  fp16: true
  gradient_checkpointing: false
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  save_total_limit: 2
augmentation:
  enabled: false
  speed_probability: 0.4
  speed_min: 0.9
  speed_max: 1.1
  gain_probability: 0.4
  gain_db_min: -6.0
  gain_db_max: 6.0
  noise_probability: 0.3
  snr_db_min: 10.0
  snr_db_max: 25.0
  specaugment_probability: 0.5
data:
  sample_rate: 16000


